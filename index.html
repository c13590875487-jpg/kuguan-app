@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap');
:root{--ink:#18241f;--muted:#7a8780;--line:#e8ece8;--paper:#fff;--bg:#f4f7f4;--green:#1b684b;--green2:#e8f4ed;--lime:#cbe881;--orange:#f59b59;--red:#d9574f;--blue:#5887b7;--shadow:0 10px 34px rgba(28,52,41,.07);font-family:'DM Sans','Noto Sans SC',sans-serif;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--bg);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:244px 1fr}.sidebar{background:#fff;border-right:1px solid var(--line);padding:26px 17px;display:flex;flex-direction:column;position:sticky;height:100vh;top:0}.brand{display:flex;align-items:center;gap:11px;padding:3px 9px 31px}.brandmark{width:38px;height:38px;border-radius:13px;background:var(--green);color:white;display:grid;place-items:center;font-size:19px;box-shadow:0 5px 13px #1b684b35}.brand b{font-size:16px;letter-spacing:.3px}.brand small{display:block;color:#89958e;font-size:10px;margin-top:2px;letter-spacing:1px}.navlabel{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;color:#a2ada6;padding:0 12px;margin:8px 0 10px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;color:#65736b;padding:12px 13px;border-radius:12px;display:flex;align-items:center;gap:13px;font-size:13px;font-weight:500}.nav button .ico{font-size:17px;width:19px;text-align:center}.nav button.active{background:var(--green2);color:var(--green);font-weight:700}.nav button:hover:not(.active){background:#f6f8f6}.sidebottom{margin-top:auto}.warehouse{margin:0 4px 15px;padding:12px;background:#f6f8f6;border-radius:13px;display:flex;gap:10px;align-items:center}.whicon{width:31px;height:31px;border-radius:10px;background:white;display:grid;place-items:center}.warehouse small{display:block;color:var(--muted);font-size:10px}.warehouse b{font-size:12px}.profile{border-top:1px solid var(--line);padding:16px 7px 0;display:flex;align-items:center;gap:10px}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#f9dfcd;color:#925d36;font-size:12px;font-weight:700}.profile b{font-size:12px}.profile small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.main{padding:26px 42px 50px;max-width:1600px;width:100%;margin:auto}.topbar{height:47px;display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}.crumb{color:#8b968f;font-size:12px}.crumb b{color:var(--ink);font-weight:600}.topright{display:flex;align-items:center;gap:16px}.iconbtn{border:1px solid var(--line);background:white;border-radius:11px;width:38px;height:38px;color:#607068;position:relative}.dot{position:absolute;width:7px;height:7px;background:var(--orange);border:1px solid white;right:8px;top:7px;border-radius:50%}.date{font-size:12px;color:var(--muted)}h1{font-size:25px;letter-spacing:-.5px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:6px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px}.btn{border:0;border-radius:11px;padding:11px 16px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:8px}.btn.primary{background:var(--green);color:#fff;box-shadow:0 5px 12px #1b684b28}.btn.primary:hover{background:#14553c}.btn.soft{background:#edf4ef;color:var(--green)}.btn.white{background:white;border:1px solid var(--line);color:#46564e}.btn.small{padding:8px 11px;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}.card{background:#fff;border:1px solid #edf0ed;border-radius:17px;padding:18px 19px;box-shadow:0 4px 18px rgba(27,49,37,.025)}.statlabel{display:flex;align-items:center;justify-content:space-between;color:#75827b;font-size:11px}.staticon{width:31px;height:31px;border-radius:10px;background:#f2f6f2;display:grid;place-items:center;font-size:15px}.statnum{font-size:27px;font-weight:700;letter-spacing:-1px;margin:9px 0 3px}.statfoot{font-size:10px;color:#9aa49e}.statfoot .up{color:var(--green);font-weight:700}.dashboardgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}.panel{background:#fff;border:1px solid #edf0ed;border-radius:17px;padding:19px;box-shadow:0 4px 18px rgba(27,49,37,.025)}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.panelhead h3{font-size:13px;margin:0}.panelhead a{font-size:11px;color:var(--green);cursor:pointer}.shortcuts{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:17px}.shortcut{background:#fff;border:1px solid #edf0ed;border-radius:15px;padding:15px;display:flex;gap:12px;align-items:center;text-align:left}.shortcut:hover{border-color:#b7d2c1;transform:translateY(-1px)}.shortcut .sico{width:38px;height:38px;border-radius:12px;background:#eaf5ee;display:grid;place-items:center;font-size:18px}.shortcut:nth-child(2) .sico{background:#fff0e4}.shortcut:nth-child(3) .sico{background:#eff2fd}.shortcut b{font-size:12px;display:block}.shortcut small{font-size:10px;color:var(--muted);display:block;margin-top:4px}.table{width:100%;border-collapse:collapse}.table th{text-align:left;font-size:10px;color:#9aa49e;font-weight:500;padding:10px 8px;border-bottom:1px solid var(--line)}.table td{font-size:11px;padding:12px 8px;border-bottom:1px solid #f0f2f0}.table tr:last-child td{border-bottom:0}.productcell{display:flex;align-items:center;gap:9px;font-weight:600}.prodicon{width:34px;height:34px;border-radius:10px;background:#f4f5ef;display:grid;place-items:center;font-size:17px}.prodicon.blue{background:#edf3f8}.prodicon.orange{background:#fdf0e5}.prodicon.violet{background:#f1eef8}.pill{font-size:10px;padding:4px 8px;border-radius:20px;background:#eaf5ee;color:#26714f}.pill.warn{background:#fff1e5;color:#bb6c27}.pill.gray{background:#f0f2f0;color:#68756d}.activity{display:grid;gap:15px}.activityrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start}.actico{width:28px;height:28px;border-radius:9px;background:#e8f4ed;display:grid;place-items:center;color:var(--green);font-size:12px}.actico.out{background:#fff0e4;color:#bf6d2b}.activityrow b{font-size:11px;display:block}.activityrow small{font-size:10px;color:#9aa49e;display:block;margin-top:4px}.activityrow strong{font-size:11px}.warning{margin-top:14px;background:#fff8ed;border:1px solid #f8e8cd;border-radius:13px;padding:12px;display:flex;gap:9px;align-items:center;color:#9c682e;font-size:11px}.warning b{color:#735126}.searchbar{display:flex;gap:10px;margin-bottom:15px}.search{flex:1;position:relative}.search input{width:100%;padding:11px 14px 11px 37px;border:1px solid var(--line);border-radius:11px;background:white;outline:none;font-size:12px}.search span{position:absolute;left:13px;top:10px;color:#8c9891}.filter{border:1px solid var(--line);background:white;border-radius:11px;padding:0 14px;font-size:11px;color:#66736b}.contenttable{background:white;border:1px solid #edf0ed;border-radius:16px;padding:6px 14px}.contenttable .table td{padding:14px 8px}.empty{padding:50px;text-align:center;color:var(--muted)}.movementtoggle{display:flex;background:#f0f3f0;border-radius:10px;padding:3px;gap:2px}.movementtoggle button{border:0;background:transparent;padding:8px 15px;font-size:11px;color:#78847c;border-radius:8px}.movementtoggle button.active{background:white;color:var(--green);font-weight:700;box-shadow:0 2px 7px #243f3014}.modalback{position:fixed;inset:0;background:#18241f55;backdrop-filter:blur(3px);z-index:10;display:none;align-items:center;justify-content:center;padding:16px}.modalback.show{display:flex}.modal{background:white;width:min(540px,100%);max-height:92vh;overflow:auto;border-radius:20px;padding:24px;box-shadow:0 20px 80px #11271b35}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.modalhead h2{font-size:18px;margin:0}.close{border:0;background:#f2f4f2;width:31px;height:31px;border-radius:9px;font-size:17px;color:#66736b}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;color:#647168;font-weight:600}.field input,.field select{border:1px solid #e5eae5;border-radius:10px;padding:11px 12px;font-size:12px;outline:none;background:white;color:var(--ink)}.field input:focus,.field select:focus{border-color:#77a88b;box-shadow:0 0 0 3px #dcefe3}.hint{font-size:10px;color:#9aa49e}.modalactions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;bottom:25px;left:50%;transform:translate(-50%,20px);opacity:0;background:#1d3026;color:white;padding:11px 17px;border-radius:11px;font-size:12px;transition:.2s;z-index:20;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}.scanarea{background:#10231b;border-radius:16px;height:200px;position:relative;display:grid;place-items:center;color:white;margin-bottom:16px;overflow:hidden}.scanframe{width:150px;height:100px;border:2px solid #cbe881;border-radius:13px;position:relative;box-shadow:0 0 30px #cbe88145}.scanframe:before,.scanframe:after{content:'';position:absolute;width:15px;height:15px;border-color:white;border-style:solid}.scanframe:before{top:-2px;left:-2px;border-width:3px 0 0 3px;border-radius:10px 0 0}.scanframe:after{bottom:-2px;right:-2px;border-width:0 3px 3px 0;border-radius:0 0 10px}.scanlabel{position:absolute;bottom:18px;color:#dce7df;font-size:11px}.scanlaser{height:1px;background:#cbe881;position:absolute;left:0;right:0;top:50%;box-shadow:0 0 8px #cbe881}.phonehint{display:none}
@media(max-width:1000px){.app{grid-template-columns:76px 1fr}.sidebar{padding:20px 10px}.brand{justify-content:center;padding:3px 0 28px}.brand b,.brand small,.navlabel,.nav button span:not(.ico),.warehouse>div:last-child,.profile>div:last-child{display:none}.nav button{justify-content:center;padding:13px 0}.sidebottom .warehouse{justify-content:center;margin:0 0 14px}.profile{justify-content:center;padding:15px 0 0}.main{padding:24px 25px 40px}}
@media(max-width:680px){body{background:#f5f7f4}.app{display:block;padding-bottom:69px}.sidebar{position:fixed;z-index:5;top:auto;bottom:0;left:0;right:0;width:100%;height:65px;padding:6px 10px;background:#fff;border:0;border-top:1px solid var(--line);display:block}.brand,.navlabel,.sidebottom{display:none}.nav{height:100%;display:flex;justify-content:space-around;align-items:center;gap:0}.nav button{display:flex;flex-direction:column;justify-content:center;gap:3px;padding:4px 9px;border-radius:10px;font-size:9px}.nav button .ico{font-size:18px}.nav button span:not(.ico){display:block}.main{padding:18px 16px 30px}.topbar{height:32px;margin-bottom:20px}.date{display:none}.heading{align-items:flex-start;margin-bottom:17px}.heading h1{font-size:22px}.heading .btn{padding:9px 11px;font-size:10px}.cards{grid-template-columns:1fr 1fr;gap:9px;margin-bottom:11px}.card{padding:14px;border-radius:14px}.statnum{font-size:24px}.dashboardgrid{grid-template-columns:1fr;gap:11px}.shortcuts{gap:7px}.shortcut{padding:11px 8px;display:grid;gap:8px;justify-items:start;border-radius:13px}.shortcut .sico{width:32px;height:32px;font-size:16px}.shortcut b{font-size:10px}.shortcut small{font-size:9px}.panel{padding:15px;border-radius:14px}.contenttable{overflow:auto;padding:4px 8px}.table{min-width:550px}.searchbar{gap:6px}.filter{padding:0 9px;font-size:10px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.modal{padding:19px}.modalback{align-items:flex-end;padding:0}.modal{border-radius:19px 19px 0 0;max-height:90vh}.phonehint{display:block;font-size:10px;color:#98a39c;text-align:center;margin:10px 0}.crumb{font-size:10px}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="brandmark">▦</div><div><b>库存管家</b><small>STOCK KEEPER</small></div></div><div class="navlabel">工作台</div><nav class="nav" id="nav"><button class="active" data-page="home"><span class="ico">⌂</span><span>总览</span></button><button data-page="products"><span class="ico">▤</span><span>商品档案</span></button><button data-page="inventory"><span class="ico">▦</span><span>库存查询</span></button><button data-page="records"><span class="ico">↕</span><span>出入库流水</span></button><button data-page="serials"><span class="ico">⌗</span><span>序列号追踪</span></button><button data-page="settings"><span class="ico">⚙</span><span>仓库设置</span></button></nav><div class="sidebottom"><div class="warehouse"><div class="whicon">⌂</div><div><small>当前仓库</small><b>总仓 · 上海</b></div><span style="margin-left:auto;color:#849189">⌄</span></div><div class="profile"><div class="avatar">林</div><div><b>林店长</b><small>管理员账号</small></div><span style="margin-left:auto;color:#929e96">···</span></div></div></aside>
<main class="main"><div class="topbar"><div class="crumb">库存管家　/　<b id="crumb">总览</b></div><div class="topright"><span class="date" id="today"></span><button class="iconbtn" title="提醒">♧<i class="dot"></i></button><div class="avatar">林</div></div></div><div id="view"></div></main></div>
<div class="modalback" id="modalback" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script>
const seedProducts=[{id:'P-1001',name:'无线降噪耳机',spec:'曜石黑 · 标准版',category:'数码配件',unit:'个',barcode:'6971000001001',serial:true,min:5,icon:'🎧',color:'blue',stock:18,price:899,purchasePrice:620,warehouse:'总仓 · 上海'},{id:'P-1002',name:'便携蓝牙音箱',spec:'雾霾蓝 · 20W',category:'数码配件',unit:'个',barcode:'6971000001002',serial:true,min:4,icon:'🔊',color:'orange',stock:12,price:399,purchasePrice:260,warehouse:'总仓 · 上海'},{id:'P-1003',name:'桌面收纳盒',spec:'米白 · 大号',category:'办公用品',unit:'个',barcode:'6971000001003',serial:false,min:8,icon:'🗃️',color:'violet',stock:6,price:59,purchasePrice:25,warehouse:'总仓 · 上海'},{id:'P-1004',name:'快充数据线',spec:'1.2m · USB-C',category:'数码配件',unit:'条',barcode:'6971000001004',serial:false,min:10,icon:'🔌',color:'',stock:34,price:39,purchasePrice:14,warehouse:'总仓 · 上海'}];
const seedMoves=[{id:'RK-20260612-008',type:'入库',product:'无线降噪耳机',spec:'曜石黑 · 标准版',qty:8,by:'林店长',time:'今天 10:24',serials:['00001','00002','00003','00004','00005','00006','00007','00008']},{id:'CK-20260612-007',type:'出库',product:'快充数据线',spec:'1.2m · USB-C',qty:4,by:'周小雨',time:'今天 09:51',serials:[]},{id:'RK-20260611-006',type:'入库',product:'便携蓝牙音箱',spec:'雾霾蓝 · 20W',qty:6,by:'林店长',time:'昨天 16:32',serials:['00009','00010','00011','00012','00013','00014']},{id:'CK-20260611-005',type:'出库',product:'桌面收纳盒',spec:'米白 · 大号',qty:2,by:'周小雨',time:'昨天 14:08',serials:[]}];
let products=JSON.parse(localStorage.getItem('keeper_products')||'null')||seedProducts,moves=JSON.parse(localStorage.getItem('keeper_moves')||'null')||seedMoves,page='home',moveType='入库',searchText='';const save=()=>{localStorage.setItem('keeper_products',JSON.stringify(products));localStorage.setItem('keeper_moves',JSON.stringify(moves))};const fmt=n=>Number(n).toLocaleString('zh-CN');document.getElementById('today').textContent=new Intl.DateTimeFormat('zh-CN',{month:'long',day:'numeric',weekday:'long'}).format(new Date());
function setPage(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({home:'总览',products:'商品档案',inventory:'库存查询',records:'出入库流水',serials:'序列号追踪',settings:'仓库设置'})[p];render()};document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)setPage(b.dataset.page)});
function title(title,sub,button=''){return `<div class="heading"><div><h1>${title}</h1><div class="sub">${sub}</div></div>${button}</div>`}function prodCell(p){return `<div class="productcell"><div class="prodicon ${p.color||''}">${p.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover;border-radius:10px">`:(p.icon||'📦')}</div><div>${p.name}<small style="display:block;color:#98a39c;font-weight:400;margin-top:3px">${p.spec}</small></div></div>`}
function render(){const v=document.getElementById('view');if(page==='home')v.innerHTML=home();if(page==='products')v.innerHTML=productsPage();if(page==='inventory')v.innerHTML=inventoryPage();if(page==='records')v.innerHTML=recordsPage();if(page==='serials')v.innerHTML=serialsPage();if(page==='settings')v.innerHTML=settingsPage();wireSearch()}
function home(){const total=products.reduce((a,p)=>a+p.stock,0),low=products.filter(p=>p.stock<=p.min).length;return `${title('早上好，林店长 👋','库存状态一目了然，今天也把每件货管清楚。',`<button class="btn primary" onclick="openMove('入库')">＋ 新建出入库</button>`)}<div class="cards"><div class="card"><div class="statlabel">商品种类<span class="staticon">▤</span></div><div class="statnum">${products.length}</div><div class="statfoot">个在售商品</div></div><div class="card"><div class="statlabel">库存总件数<span class="staticon">▦</span></div><div class="statnum">${fmt(total)}</div><div class="statfoot"><span class="up">↑ 12.8%</span>　较上月</div></div><div class="card"><div class="statlabel">今日入库<span class="staticon">↙</span></div><div class="statnum">${moves.filter(m=>m.type==='入库'&&m.time.includes('今天')).reduce((a,m)=>a+m.qty,0)}</div><div class="statfoot">件商品已登记</div></div><div class="card"><div class="statlabel">库存预警<span class="staticon" style="background:#fff5e9">♧</span></div><div class="statnum" style="color:${low?'#bd7b31':'inherit'}">${low}</div><div class="statfoot">种商品低于安全库存</div></div></div><div class="shortcuts"><button class="shortcut" onclick="openMove('入库')"><div class="sico">↙</div><div><b>扫码入库</b><small>扫描商品 / 序列号</small></div></button><button class="shortcut" onclick="openMove('出库')"><div class="sico">↗</div><div><b>扫码出库</b><small>逐件核对序列号</small></div></button><button class="shortcut" onclick="openScan()"><div class="sico">⌗</div><div><b>快速查库存</b><small>扫条码即查现存量</small></div></button></div><div class="dashboardgrid"><section class="panel"><div class="panelhead"><h3>最近出入库</h3><a onclick="setPage('records')">查看全部　→</a></div>${activityList(moves.slice(0,4))}</section><section class="panel"><div class="panelhead"><h3>库存预警</h3><a onclick="setPage('inventory')">查看库存　→</a></div>${products.filter(p=>p.stock<=p.min).length?products.filter(p=>p.stock<=p.min).map(p=>`<div class="activityrow" style="grid-template-columns:34px 1fr auto;margin:13px 0"><div class="prodicon orange">${p.icon}</div><div><b>${p.name}</b><small>${p.spec} · 安全库存 ${p.min} ${p.unit}</small></div><strong style="color:#d27632">${p.stock} ${p.unit}</strong></div>`).join(''):'<div class="empty">✅　库存充足，暂时没有预警</div>'}<div class="warning">💡 <span><b>小提示</b>　给每件商品贴上序列号标签，扫码即可追踪去向。</span></div></section></div>`}
function activityList(list){return `<div class="activity">${list.map(m=>`<div class="activityrow"><div class="actico ${m.type==='出库'?'out':''}">${m.type==='入库'?'↙':'↗'}</div><div><b>${m.product} <span class="pill ${m.type==='出库'?'warn':''}">${m.type}</span></b><small>${m.id}　·　${m.by}　·　${m.time}</small></div><strong>${m.type==='入库'?'+':'−'}${m.qty}</strong></div>`).join('')||'<div class="empty">还没有出入库记录</div>'}</div>`}
function productsPage(){const list=products.filter(p=>(p.name+p.spec+p.id+p.barcode).toLowerCase().includes(searchText.toLowerCase()));return `${title('商品档案','管理商品名称、规格、条码和单品序列号。',`<button class="btn primary" onclick="openProduct()">＋ 登记商品</button>`)}<div class="searchbar"><div class="search"><span>⌕</span><input id="q" placeholder="搜索商品名称、编码或条码" value="${searchText}"></div><button class="filter">⌄　全部分类</button></div><div class="contenttable"><table class="table"><thead><tr><th>商品</th><th>商品编码</th><th>条码</th><th>管理方式</th><th>现存量</th><th>安全库存</th><th>操作</th></tr></thead><tbody>${list.map(p=>`<tr><td>${prodCell(p)}</td><td>${p.id}</td><td>${p.barcode||'—'}</td><td><span class="pill ${p.serial?'':'gray'}">${p.serial?'一物一码':'普通库存'}</span></td><td><b>${p.stock}</b> ${p.unit}</td><td>${p.min} ${p.unit}</td><td><button class="btn soft small" onclick="openMove('入库','${p.id}')">出入库</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">没有找到商品</div></td></tr>'}</tbody></table></div>`}
function inventoryPage(){return `${title('库存查询','按仓库查看实时库存，低于安全库存时及时提醒。',`<button class="btn white" onclick="showToast('库存清单已准备好')">⇩ 导出清单</button>`)}<div class="searchbar"><div class="search"><span>⌕</span><input id="q" placeholder="搜索商品" value="${searchText}"></div><button class="filter">⌂　总仓 · 上海　⌄</button><button class="filter">全部状态　⌄</button></div><div class="contenttable"><table class="table"><thead><tr><th>商品</th><th>仓库</th><th>现存量</th><th>安全库存</th><th>库存状态</th><th>库存金额</th></tr></thead><tbody>${products.filter(p=>(p.name+p.spec).toLowerCase().includes(searchText.toLowerCase())).map(p=>`<tr><td>${prodCell(p)}</td><td>${p.warehouse||'总仓 · 上海'}</td><td><b>${p.stock}</b> ${p.unit}</td><td>${p.min} ${p.unit}</td><td><span class="pill ${p.stock<=p.min?'warn':''}">${p.stock<=p.min?'需要补货':'充足'}</span></td><td>¥${fmt(p.stock*p.price)}</td></tr>`).join('')}</tbody></table></div>`}
function recordsPage(){return `${title('出入库流水','每一次库存变化都有记录，按单据追溯商品去向。',`<button class="btn primary" onclick="openMove('入库')">＋ 新建单据</button>`)}<div class="panel" style="padding:9px 14px;margin-bottom:14px"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div class="movementtoggle"><button class="active" onclick="recordFilter(this,'全部')">全部</button><button onclick="recordFilter(this,'入库')">入库</button><button onclick="recordFilter(this,'出库')">出库</button></div><button class="filter">最近 30 天　⌄</button></div></div><div class="contenttable"><table class="table"><thead><tr><th>单据编号</th><th>类型</th><th>商品 / 规格</th><th>数量</th><th>经手人</th><th>时间</th><th></th></tr></thead><tbody id="recordrows">${moveRows(moves)}</tbody></table></div>`}
function moveRows(ms){return ms.map(m=>`<tr><td><b>${m.id}</b></td><td><span class="pill ${m.type==='出库'?'warn':''}">${m.type}</span></td><td>${m.product}<small style="display:block;color:#9aa49e;margin-top:3px">${m.spec||''}</small></td><td>${m.type==='入库'?'+':'−'}${m.qty}</td><td>${m.by}</td><td>${m.time}</td><td><button class="btn white small" onclick="showToast('单据 ${m.id}')">查看</button></td></tr>`).join('')||'<tr><td colspan="7"><div class="empty">暂无单据记录</div></td></tr>'}function recordFilter(btn,type){document.querySelectorAll('.movementtoggle button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');document.getElementById('recordrows').innerHTML=moveRows(type==='全部'?moves:moves.filter(m=>m.type===type))}
function serialsPage(){const latest=new Map();[...moves].reverse().forEach(m=>(m.serials||[]).forEach(s=>latest.set(s,m)));const rows=[...latest.entries()].map(([s,m])=>({s,m}));return `${title('序列号追踪','一件商品一个唯一编号，查得到入库来源和出库去向。',`<button class="btn primary" onclick="openScan()">⌗ 扫描序列号</button>`)}<div class="searchbar"><div class="search"><span>⌕</span><input id="q" placeholder="搜索或扫描序列号" value="${searchText}"></div><button class="filter">全部状态　⌄</button></div><div class="contenttable"><table class="table"><thead><tr><th>序列号</th><th>商品</th><th>规格</th><th>当前状态</th><th>最近单据</th><th>更新时间</th></tr></thead><tbody>${rows.filter(({s,m})=>(s+m.product).toLowerCase().includes(searchText.toLowerCase())).map(({s,m})=>`<tr><td><b style="font-family:monospace">${s}</b></td><td>${m.product}</td><td>${m.spec}</td><td><span class="pill ${m.type==='入库'?'':'warn'}">${m.type==='入库'?'在库':'已出库'}</span></td><td>${m.id}</td><td>${m.time}</td></tr>`).join('')||'<tr><td colspan="6"><div class="empty">还没有序列号记录。入库时添加序列号即可开始追踪。</div></td></tr>'}</tbody></table></div>`}
function settingsPage(){return `${title('仓库设置','管理仓库、成员与扫码偏好。')}<div class="dashboardgrid"><section class="panel"><div class="panelhead"><h3>仓库</h3><button class="btn soft small" onclick="showToast('仓库新增已开启')">＋ 添加仓库</button></div><div class="activityrow"><div class="actico">⌂</div><div><b>总仓 · 上海</b><small>默认仓库　·　上海市</small></div><span class="pill">使用中</span></div></section><section class="panel"><div class="panelhead"><h3>扫码设置</h3></div><div style="font-size:12px;line-height:2;color:#6f7c74">支持手机摄像头扫码、蓝牙扫码枪与手动输入。商品启用序列号后，入库需逐件登记唯一编号，出库需核对在库编号。</div><button class="btn white small" style="margin-top:15px" onclick="openScan()">测试扫码入口　→</button></section></div>`}
function wireSearch(){const q=document.getElementById('q');if(q)q.oninput=()=>{searchText=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');if(n){n.focus();n.setSelectionRange(pos,pos)}}}
function openProduct(){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>登记新商品</h2><button class="close" onclick="closeModal()">×</button></div><form id="pform"><div class="formgrid"><div class="field full"><label>商品名称 *</label><input name="name" required placeholder="例如：无线降噪耳机"></div><div class="field"><label>规格型号</label><input name="spec" placeholder="颜色、尺寸、型号"></div><div class="field"><label>商品分类</label><select name="category"><option>数码配件</option><option>办公用品</option><option>服饰</option><option>食品饮料</option><option>其他</option></select></div><div class="field"><label>计量单位</label><select name="unit"><option>个</option><option>件</option><option>台</option><option>箱</option><option>条</option></select></div><div class="field"><label>商品条码</label><input name="barcode" placeholder="扫码或手动输入"></div><div class="field"><label>安全库存</label><input name="min" type="number" value="5" min="0"></div><div class="field"><label>参考单价（元）</label><input name="price" type="number" value="0" min="0"></div><div class="field full"><label style="display:flex;gap:9px;align-items:center"><input name="serial" type="checkbox" style="accent-color:#1b684b;width:15px;height:15px">启用一物一码序列号管理</label><div class="hint">适合数码、设备等逐件追溯的商品；每件商品拥有唯一序列号。</div></div></div><div class="modalactions"><button type="button" class="btn white" onclick="closeModal()">取消</button><button class="btn primary">保存商品</button></div></form>`;showModal();document.getElementById('pform').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));products.unshift({id:'P-'+String(Date.now()).slice(-6),name:d.name,spec:d.spec||'默认规格',category:d.category,unit:d.unit,barcode:d.barcode,serial:e.target.serial.checked,min:+d.min||0,icon:'📦',color:'',stock:0,price:+d.price||0,warehouse:'总仓 · 上海'});save();closeModal();setPage('products');showToast('商品档案已保存')};}
function openMove(type='入库',productId=''){moveType=type;const options=products.map(p=>`<option value="${p.id}" ${p.id===productId?'selected':''}>${p.name} · ${p.spec}${p.serial?'（序列号管理）':''}</option>`).join('');const date=new Date().toISOString().slice(0,10);document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>新建${type}单</h2><button class="close" onclick="closeModal()">×</button></div><div class="movementtoggle" style="width:max-content;margin-bottom:17px"><button class="${type==='入库'?'active':''}" onclick="switchMove('入库')">入库</button><button class="${type==='出库'?'active':''}" onclick="switchMove('出库')">出库</button></div><form id="mform"><div class="formgrid"><div class="field full"><label>商品 *</label><div style="display:flex;gap:7px"><select name="pid" id="moveProduct" style="flex:1">${options}</select><button type="button" class="btn soft" onclick="openScan(true)">⌗ 扫码</button></div></div>${type==='入库'?`<div class="field full"><label>产品图片</label><div style="display:flex;gap:12px;align-items:center"><div id="imagePreview" style="width:64px;height:64px;border:1px dashed #cbd5cd;background:#f6f8f6;border-radius:12px;display:grid;place-items:center;overflow:hidden;color:#839188;font-size:11px">商品图片</div><label class="btn white small" style="cursor:pointer">选择图片<input id="productImage" type="file" accept="image/*" hidden></label><span class="hint">可上传或替换商品图片</span></div></div><div class="field"><label>进货价（元）</label><input name="purchasePrice" id="purchasePrice" type="number" min="0" step="0.01" value="${products.find(p=>p.id===productId)?.purchasePrice||0}"></div><div class="field"><label>销售价（元）</label><input name="salePrice" id="salePrice" type="number" min="0" step="0.01" value="${products.find(p=>p.id===productId)?.price||0}"></div><div class="field"><label>登记日期</label><input name="entryDate" type="date" value="${date}"></div>`:''}<div class="field"><label>数量 *</label><input name="qty" id="moveQty" type="number" value="1" min="1" required></div><div class="field"><label>经手人</label><input name="by" value="林店长"></div><div class="field full" id="serialfield"><label>产品序列号（每行一个）</label><div style="display:flex;gap:7px;align-items:flex-start"><textarea id="serialInput" name="serials" rows="3" placeholder="从 00001 开始填写或逐件扫码，每行一个" style="flex:1;resize:vertical;border:1px solid #e5eae5;border-radius:10px;padding:11px 12px;font:inherit;font-size:12px"></textarea><button type="button" class="btn soft small" onclick="startSerialCamera()">⌗ 扫码录入</button></div><video id="serialvideo" autoplay playsinline style="display:none;width:100%;border-radius:12px;margin-top:8px"></video><div style="display:flex;align-items:center;gap:8px;margin-top:7px"><button type="button" class="btn white small" onclick="generateSerials()">按数量生成序列号</button><span class="hint" id="serialhint">五位数字，从 00001 起连续编号。</span></div></div><div class="field full"><label>备注</label><input name="note" placeholder="可选，填写来源或用途"></div></div><div class="modalactions"><button type="button" class="btn white" onclick="closeModal()">取消</button><button class="btn primary">确认${type}</button></div></form>`;showModal();const select=document.getElementById('moveProduct'),imageInput=document.getElementById('productImage');function update(){const p=products.find(x=>x.id===select.value),sf=document.getElementById('serialfield');sf.style.display=p?.serial?'grid':'none';if(document.getElementById('purchasePrice'))document.getElementById('purchasePrice').value=p?.purchasePrice||0;if(document.getElementById('salePrice'))document.getElementById('salePrice').value=p?.price||0;const preview=document.getElementById('imagePreview');if(preview)preview.innerHTML=p?.image?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`:'商品图片'}select.onchange=update;update();if(imageInput)imageInput.onchange=()=>{const f=imageInput.files?.[0];if(!f)return;const reader=new FileReader();reader.onload=()=>document.getElementById('imagePreview').innerHTML=`<img src="${reader.result}" style="width:100%;height:100%;object-fit:cover">`;reader.readAsDataURL(f)};document.getElementById('mform').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target)),p=products.find(x=>x.id===d.pid),qty=+d.qty,sn=(d.serials||'').split(/\s+/).filter(Boolean);if(!p)return;if(p.serial&&sn.length!==qty){showToast(`请登记 ${qty} 个序列号，当前 ${sn.length} 个`);return}if(new Set(sn).size!==sn.length){showToast('序列号不能重复');return}if(p.serial&&sn.some(s=>!/^\d{5}$/.test(s))){showToast('序列号必须为五位数字，从 00001 起');return}if(moveType==='入库'&&p.serial){const next=nextSerialNumber();if(sn.some((s,i)=>Number(s)!==next+i)){showToast(`请从 ${String(next).padStart(5,'0')} 开始连续编号`);return}}if(moveType==='出库'&&p.stock<qty){showToast('库存不足，无法出库');return}if(p.serial&&moveType==='入库'&&sn.some(s=>serialStatus(s))){showToast('存在已登记过的序列号');return}if(p.serial&&moveType==='出库'&&sn.some(s=>serialStatus(s)!==p.name)){showToast('存在非此商品或未登记在库的序列号');return}if(moveType==='入库'){p.purchasePrice=+d.purchasePrice||0;p.price=+d.salePrice||0;if(imageInput?.files?.[0])p.image=document.getElementById('imagePreview').querySelector('img')?.src}p.stock+=moveType==='入库'?qty:-qty;moves.unshift({id:(moveType==='入库'?'RK-':'CK-')+new Date().toISOString().slice(0,10).replaceAll('-','')+'-'+String(moves.length+1).padStart(3,'0'),type:moveType,product:p.name,spec:p.spec,qty,by:d.by||'林店长',time:d.entryDate||'今天 '+new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()),entryDate:d.entryDate||date,purchasePrice:+d.purchasePrice||p.purchasePrice||0,salePrice:+d.salePrice||p.price||0,serials:sn,note:d.note});save();closeModal();render();showToast(`${moveType}成功，库存已更新`)};}
function nextSerialNumber(){let max=0;moves.forEach(m=>(m.serials||[]).forEach(s=>{if(/^\d{5}$/.test(s))max=Math.max(max,Number(s))}));return max+1}function generateSerials(){const qty=+document.getElementById('moveQty').value||0,area=document.getElementById('serialInput');if(!qty){showToast('请先填写数量');return}const start=nextSerialNumber();area.value=Array.from({length:qty},(_,i)=>String(start+i).padStart(5,'0')).join('\n')}
async function startSerialCamera(){try{if(!('BarcodeDetector'in window))throw Error('此浏览器暂不支持摄像头识别，请手动填写或连接扫码枪');const detector=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13']});const video=document.getElementById('serialvideo'),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.style.display='block';let last='';const tick=async()=>{if(!document.getElementById('serialvideo')||video.srcObject!==stream)return;try{const codes=await detector.detect(video);if(codes.length&&codes[0].rawValue!==last){last=codes[0].rawValue;const area=document.getElementById('serialInput'),value=last.trim();if(/^\d{5}$/.test(value)&&!area.value.split(/\s+/).includes(value)){area.value+=(area.value?'\n':'')+value;showToast(`已录入序列号 ${value}`)}else if(!/^\d{5}$/.test(value))showToast('序列号必须为五位数字');}}catch{}requestAnimationFrame(tick)};requestAnimationFrame(tick)}catch(e){showToast(e.message||'无法打开摄像头')}}
function serialStatus(s){const last=moves.find(m=>(m.serials||[]).includes(s));return last?.type==='入库'?last.product:last?'已出库':''}function switchMove(t){openMove(t,document.getElementById('moveProduct')?.value)}
function openScan(forMove=false){document.getElementById('modal').innerHTML=`<div class="modalhead"><h2>扫码${forMove?'选择商品':'查询库存'}</h2><button class="close" onclick="closeModal()">×</button></div><div class="scanarea" id="scanarea"><div class="scanframe"><div class="scanlaser"></div></div><div class="scanlabel" id="scanlabel">将商品条码或序列号放入框内</div></div><div class="field"><label>也可以手动输入条码 / 序列号</label><div style="display:flex;gap:7px"><input id="scaninput" placeholder="输入或粘贴编码" style="flex:1"><button class="btn primary" onclick="lookupScan(${forMove})">查询</button></div></div><div class="phonehint">如浏览器询问摄像头权限，请选择允许。</div><div class="modalactions"><button class="btn white" onclick="startCamera(${forMove})">开启摄像头</button><button class="btn white" onclick="closeModal()">关闭</button></div><video id="video" autoplay playsinline style="display:none;width:100%;border-radius:12px;margin-top:10px"></video>`;showModal()}
async function startCamera(forMove=false){try{if(!('BarcodeDetector'in window))throw Error('浏览器不支持原生条码识别，请手动输入或连接扫码枪');const detector=new BarcodeDetector({formats:['qr_code','ean_13','code_128','code_39','ean_8','upc_a']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}),video=document.getElementById('video');video.srcObject=stream;video.style.display='block';document.getElementById('scanlabel').textContent='正在识别…';const tick=async()=>{if(!document.getElementById('video')||video.srcObject!==stream)return;try{const codes=await detector.detect(video);if(codes.length){document.getElementById('scaninput').value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());document.getElementById('scanlabel').textContent='识别成功';lookupScan(forMove);return}}catch{}requestAnimationFrame(tick)};requestAnimationFrame(tick)}catch(e){showToast(e.message||'无法打开摄像头')}}
function lookupScan(forMove=false){const value=document.getElementById('scaninput').value.trim();if(!value){showToast('请先输入条码或序列号');return}const p=products.find(x=>x.barcode===value||x.id===value);const serialProduct=products.find(x=>x.serial&&moves.some(m=>(m.serials||[]).includes(value)&&m.product===x.name));if(p){if(forMove){const type=moveType;closeModal();openMove(type,p.id)}else{closeModal();setPage('inventory');searchText=p.name;render();showToast(`${p.name}：现存 ${p.stock} ${p.unit}`)}}else if(serialProduct){closeModal();setPage('serials');searchText=value;render();showToast(`已找到序列号 ${value}`)}else showToast('暂未找到该编码，可先登记商品')}
function showModal(){document.getElementById('modalback').classList.add('show')}function closeModal(){document.getElementById('modalback').classList.remove('show');['video','serialvideo'].forEach(id=>{const v=document.getElementById(id);if(v?.srcObject)v.srcObject.getTracks().forEach(t=>t.stop())})}let toastTimer;function showToast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400)}render();
</script><script>if('serviceWorker'in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}))}</script></body></html>
